# ── ESS 설비 스펙 정의 ─────────────────────────────────────────────────────────
# 적용 기술: LFP (LiFePO4) 리튬인산철 BESS — 2025년 한국 배전 연계 기준
#
# 주요 출처:
#   - 셀 특성: CATL LFP CTP 3.0 제품 데이터 (2024); BYD LFP Blade 셀 데이터 (2024)
#   - 사이클 수명: IEC 62619:2022 § 7.4, UL 9540 Part C
#   - 비용 단가: 한국전력공사 ESS FR 시스템 구매 낙찰 단가 (2022~2024);
#               BloombergNEF Energy Storage Market Outlook 2024
#   - O&M: IRENA "Utility-Scale Batteries" Innovation Outlook (2023);
#          한국에너지공단 ESS 운영 실태조사 (2023)
#   - PCS 역률: IEEE Std 1547-2018 § 8.3 (PV와 동일 기준)
#   - 안전: IEC 62619:2022 (Li-ion 배터리 안전 요건)
#
# 상세 가정·한계: docs/ASSUMPTIONS.md 참조
# ──────────────────────────────────────────────────────────────────────────────

technology_type: "LFP"             # LiFePO4 (리튬인산철)
description: "배전 연계 BESS (100kW~3MW, 2~4h 지속시간), LFP 프리즈매틱 셀 기준"

# ── 1. 셀·팩 전기 스펙 ─────────────────────────────────────────────────────────
cell:
  chemistry: "LFP"
  # [참고: LFP = LiF ePO4 양극 + 흑연 음극. 열폭주 없음(자기 발화 온도 ~400°C)]
  # [출처: Whittingham (2004) Chem.Rev.; CATL LFP CTP 3.0 제품 소개 (2024)]

  nominal_voltage_v: 3.2
  # [출처: CATL LFP CTP 3.0; BYD Blade LFP — 공칭 셀 전압 3.2V (충전 상한 3.65V)]
  # [참고: NMC(3.6V), LFP(3.2V) 비교: LFP가 낮은 전압 → 에너지 밀도 낮지만 수명·안전 우위]

  energy_density_wh_per_kg: 160
  # [출처: CATL LFP CTP 3.0 중량 에너지 밀도 (팩 수준): 160 Wh/kg (2024)]
  # [참고: BYD Blade LFP: 140~150 Wh/kg; 셀 수준 상위제품: 175~180 Wh/kg]

  volumetric_density_wh_per_l: 280
  # [출처: CATL LFP CTP 3.0 체적 에너지 밀도 (팩 수준): ~280 Wh/L]

  temp_range_operation_c: [-20, 55]
  # [출처: IEC 62619:2022 § 5.2 동작 온도 범위 (정격); CATL 시방서]
  # [참고: -20°C 이하 → 방전 용량 급감; 45°C 이상 → 노화 가속]

  temp_range_storage_c: [-40, 60]
  # [출처: IEC 62619:2022 보관 온도; CATL 시방서]

# ── 2. 시스템 성능 (BESS 시스템 = 배터리팩 + PCS + BMS/EMS) ─────────────────
system:
  round_trip_efficiency: 0.925
  # [출처: NREL "Grid-Scale Battery Storage: Frequently Asked Questions" (2023):
  #        LFP BESS 왕복 효율 90~95%, 전형값 92~93%]
  # [출처: DNV GL "Energy Storage Technology Review" (2022): LFP 92~94% (DC-DC)]
  # [참고: 모델 채택값 efficiency: 0.95 는 일방향 효율 √0.925 ≈ 0.962의 근사값;
  #        충·방전 동일 효율 가정 → sqrt(RT_eff)로 환산]
  # [가정] base.yaml efficiency: 0.95 = 단방향 효율 (충전 η = 방전 η = 0.95)
  #        → RT eff = 0.95² = 0.9025 (보수적); 시장 대표값은 ~0.925

  soc_min: 0.10
  # [출처: 한국전력공사 ESS FR 운영 기준 (2024) — 하한 SOC 10% 유지 권고]
  # [출처: NREL "Best Practices for Operation and Maintenance of PV+ESS" (2023):
  #        LFP DOD 상한 90%, 하한 SOC 10% 권장]
  # [참고: 딥 방전(SOC < 5%)은 구리 집전체 용해로 돌이킬 수 없는 용량 감소 유발]

  soc_max: 0.90
  # [출처: 위와 동일; 만충(SOC 100%) 장기 보관 시 캘린더 노화 가속]
  # [참고: SOC 범위 10~90% → 실사용 DoD 80%; LFP에서 수명 최적화 범위]

  usable_dod: 0.80
  # = soc_max - soc_min = 0.90 - 0.10
  # [참고: LFP 사이클 수명 시험 기준 DoD (IEC 62619 § 7.4.2)]

  self_discharge_rate_per_month: 0.01
  # [출처: CATL LFP CTP 자가방전율: 월 1~2%]
  # [참고: NMC 2~3%/월 대비 낮은 편; 24h 모델에서는 무시 가능 (0.03%/일)]
  # [가정] 단기(24h) 운영 모델에서 자가방전 미반영 (영향: < 0.03%/일)

# ── 3. 수명 특성 ─────────────────────────────────────────────────────────────
lifetime:
  cycle_life: 4000
  # [출처: IEC 62619:2022 § 7.4.2 — 80% DoD, EOL=80% 기준 사이클 수명]
  # [출처: CATL LFP CTP 3.0: 4,000 사이클 @80% DoD (80% 잔존 용량 보증)]
  # [출처: BYD LFP Blade: 3,000~6,000 사이클 (셀 특성에 따라 상이)]
  # [참고: base.yaml c_deg 계산 시 보수적 n_cycles=3,000 사용:
  #        c_deg = c_energy / (2×3000) = 33,333원/MWh throughput]

  calendar_life_years: 15
  # [출처: NREL "Grid-Scale Battery Storage FAQ" (2023): LFP 달력 수명 15~20년]
  # [출처: Vetter et al. "Ageing mechanisms in lithium-ion batteries"
  #        J. Power Sources 147(1-2), 2005 — 온도 의존 달력 노화 모델]
  # [참고: 25°C 유지 조건 기준; 한국 하절기 고온(40°C+) 시 달력 노화 가속]
  # [가정] 계획기간 15년 = 달력 수명과 일치 → 교체 미반영

  capacity_fade_rate_per_year: 0.020
  # [출처: Ecker et al. "Calendar and cycle life study of LFP/graphite" (2014)
  #        J. Power Sources 248: ~2%/yr @25°C 달력 노화]
  # [출처: NREL "Degradation of Li-Ion Batteries" (2019): LFP 1~3%/yr 달력 노화]
  # 계획기간 평균 유효용량계수: (1-(1-0.02)^15)/(15×0.02) ≈ 0.864
  # ★ 현재 모델 미반영 (c_deg로 사이클 노화만 반영); 향후 개선 과제

  eol_capacity_pct: 0.80
  # [출처: CATL/BYD 제품 보증 기준 — 10년 80% 잔존 용량 보증]
  # [출처: IEC 62619:2022 § 3.3 EOL 정의: 초기 정격 용량의 80%]

# ── 4. 전력변환장치 (PCS: Power Conversion System) ───────────────────────────
pcs:
  efficiency: 0.975
  # [출처: ABB PCS100 ESS-D (2024); Sungrow ST2752UX (2024) — PCS 효율 97.0~97.8%]
  # [참고: CEC 공인 효율 기준 (가중 평균); 인버터 효율과 동일 기준]

  pf_min: 0.95
  # [출처: IEEE Std 1547-2018 § 8.3.4 (Advanced Inverter Functions)]
  # [출처: 한국전력공사 분산형전원 배전계통 연계 기술기준 (2024)]
  # → |Q_pcs| ≤ S × tan(arccos(0.95)) ≈ 0.329 × S [Mvar]

  overload_factor: 1.10
  # [출처: IEC 62109-2 § 4.3.4; UL 1741 SA § 5.3 (10분 이내 110% 허용)]

  response_time_ms: 100
  # [출처: KPX 주파수조정(FR) 예비력 입찰 기준 (2024) — 응동 지연 < 100ms 요구]
  # [참고: LFP BESS + PCS 실측 응동시간: 50~80ms (요건 충족)]

  ramp_rate_mw_per_min: 999
  # 실질적으로 무제한 (배터리 전기화학 반응 속도 > 계통 제어 요구 속도)
  # [출처: EPRI "Utility-Scale ESS Technical Performance" (2023): LFP 램프율 > 100%Pn/분]
  # [가정] 24h 계획 모델에서 램프율 제약 미반영 (시간 해상도 1h 기준 불필요)

  grid_code: "KEPCO_2024"
  # [출처: 한국전력공사 분산형전원 배전계통 연계 기술기준 (KEC 제508절, 2024 개정)]

# ── 5. FR 보조서비스 (주파수조정 예비력) ──────────────────────────────────────
fr_ancillary:
  eligible: true
  # [출처: 전력시장운영규칙 제5장 보조서비스 (KPX, 2024 개정)]
  # [참고: ESS 배터리는 FR 상향·하향 예비력 입찰 가능 (용량 1MW 이상)]

  fr_cap_price_krw_per_mw_h: 8500
  # [원/MW/h] KPX FR 예비력 용량요금 전형값 (2023~2024 평균)
  # [출처: KPX 보조서비스 정산 공시 자료 (2024 상반기)]
  # [참고: 실시간 입찰가 변동 있음; 8,000~10,000원/MW/h 범위]

  min_reserve_mw: 0.5
  # [출처: 전력시장운영규칙 제5.4조 — FR 최소 입찰 용량 500kW]

# ── 6. 비용 구조 (2025년 기준, 100kW~3MW 규모) ───────────────────────────────
# 총 설치비 기준: 배터리팩 + PCS + BMS/EMS + 토목/기계설비 + 연계공사
# [참고] 용량 비례(에너지, c_energy)와 출력 비례(전력, c_power)로 분리 산정
cost:
  # 항목별 CAPEX

  c_battery_pack_per_mwh: 120_000_000
  # [원/MWh] LFP 팩 (셀+팩 조립, BMS 제외)
  # [출처: BloombergNEF Energy Storage Market Outlook 2024 — LFP 팩 단가 $80~100/kWh → ×1,350원/$]
  # [출처: SNE Research "Korea ESS Market Report Q3 2024" — 국내 LFP 팩 공급가 130~160 만원/kWh]
  # [참고: CATL/BYD OEM 단가; 국내 수입 관세 및 물류비 포함]

  c_bms_ems_per_mwh: 15_000_000
  # [원/MWh] BMS(Battery Management System) + EMS(Energy Management System)
  # [출처: 한국전력공사 ESS FR 시스템 구매 계약 단가 내역 (2023)]
  # [참고: BMS: 셀 밸런싱·보호 회로; EMS: 계통 통신·최적 운전 제어]

  c_installation_per_mwh: 25_000_000
  # [원/MWh] 토목·기계설비 (컨테이너 또는 옥내 설치, HVAC 포함)
  # [출처: 한국에너지공단 ESS 보급 실태조사 (2023) 설치비 분석]
  # [참고: 컨테이너형(20ft) 기준; 건물 매립형은 추가 공사비 발생]

  c_pcs_per_mw: 80_000_000
  # [원/MW] PCS (Power Conversion System, 인버터 기반)
  # [출처: ABB/Sungrow/LS Electric PCS 국내 공급가 기준 (2024)]
  # [출처: IEA "World Energy Investment 2024" — 한국 BESS PCS 단가 $50~70/kW]

  c_grid_conn_per_mw: 30_000_000
  # [원/MW] 배전망 연계공사비
  # [출처: 한국전력공사 ESS 연계공사비 분담 기준 (2024)]

  # 합계 (2MWh/1MW 기준 예시):
  #   = 120M×2 + 15M×2 + 25M×2 + 80M×1 + 30M×1 = 430M원 = 215만원/kWh
  # → base.yaml: c_energy=200M원/MWh, c_power=150M원/MW
  #   1MW/2MWh: 200M×2 + 150M×1 = 550M원 = 275만원/kWh (유사 수준)
  # [출처: 한국전력공사 ESS FR 시스템 낙찰 단가 (2022): 평균 278만원/kWh]
  # [출처: BloombergNEF 2024 한국 BESS all-in 설치비: $180~220/kWh ≈ 243~297만원/kWh]

  c_energy_per_mwh: 200_000_000   # [원/MWh] base.yaml 사용 (= 배터리팩+BMS+설치 합산 근사)
  c_power_per_mw: 150_000_000     # [원/MW]  base.yaml 사용 (= PCS+연계공사 합산 근사)
  c_fixed_per_site: 30_000_000    # [원/site] 사이트 고정비 (인허가·부지 준비)
  # [출처: 한국에너지공단 소규모 ESS 인허가 비용 실태 (2023)]

  om_rate: 0.025
  # [연간 O&M 비율, CAPEX 대비]
  # [출처: IRENA "Utility-Scale Batteries" Innovation Outlook (2023):
  #        LFP BESS O&M $8~15/kWh/yr → capex $200/kWh 기준 ≈ 4~7.5%; 소규모 상위]
  # [출처: NREL "Grid-Scale Battery Storage FAQ" (2023): 총 CAPEX의 1.5~2.5%/yr]
  # [출처: 한국에너지공단 ESS 운영 실태조사 (2023): 국내 O&M 연 2~3%]

  c_deg_per_mwh: 33_333
  # [원/MWh throughput] 사이클 노화 단가 (열화 비용)
  # = c_energy / (2 × n_cycles) = 200,000,000 / (2 × 3,000) = 33,333원/MWh
  # [출처: Hesse et al. "Economic Optimization of Component Sizing for Residential
  #        Battery Storage Systems" (2017) Energies 10(7) — 사이클 당가 모델]
  # [참고: n_cycles=3,000 (보수적; IEC 62619 LFP 최소 사이클 수명 기준)]
  #        CATL 보증 기준(4,000 사이클) 적용 시 c_deg = 200M/(2×4000) = 25,000원/MWh
  # [주의] 사이클 노화(c_deg)와 달력 노화(capacity_fade)는 별도 메커니즘.
  #        현재 모델은 사이클 노화만 반영 (운영비 항에 포함).

# ── 7. 안전·인증 ─────────────────────────────────────────────────────────────
safety:
  cell_standard: "IEC 62619:2022"
  # [출처: IEC 62619:2022 "Safety requirements for secondary lithium cells and batteries
  #        for use in industrial applications"]

  system_standard: "UL 9540"
  # [출처: UL 9540 "Standard for Energy Storage Systems and Equipment" (2023 edition)]

  fire_protection: "NFPA 855"
  # [출처: NFPA 855:2023 "Standard for the Installation of Stationary Energy Storage Systems"]
  # [참고: 한국 소방청 ESS 화재안전기준 (고시 제2023-7호) — NFPA 855 준용]

  korea_certification: "KC인증 (전기안전관리법)"
  # [출처: 전기안전관리법 제23조, 전기용품안전관리법 — ESS 설치 전 KC 마크 필수]
